name: CTP Image Build
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PACKAGE_NAME: ctp

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'branch'
    permissions:
      contents: write
      actions: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      -
        name: Bump version tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_LATEST=$(git describe --tags --abbrev=0)
          NEW_TAG=$(echo "$TAG_LATEST" | awk -F. '{$NF = $NF + 1;} 1' OFS=.)
          git tag -a "$NEW_TAG" -m "Bump version to $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
      -
        name: Trigger release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml --ref ${{ steps.bump.outputs.new_tag }}

  build:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}
          tags: |
            type=semver,priority=900,pattern={{version}}
            type=match,priority=800,pattern=v(.*)
            type=match,priority=800,pattern=\d.\d.\d.\d
            type=sha
      - 
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - 
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - 
        name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - 
        name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          # cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}:buildcache
          # cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
